<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Fams</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            border: none;
        }

        #fullscreenBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbxvbYCcbusoSZ2bu-nQja8NpG9QZpvQlIQBJ2feOiZ4v7e2h9oZ1q4A2PU9sLKCv7Ia1w/exec"
        allowfullscreen>
    </iframe>

    <button id="fullscreenBtn">
        Fullscreen
    </button>

    <script>
        document.getElementById("fullscreenBtn").addEventListener("click", function () {
            const iframe = document.getElementById("appFrame");

            if (iframe.requestFullscreen) {
                iframe.requestFullscreen().catch(error => {
                    console.error("Fullscreen error:", error);
                });
            }
        });
    </script>

</body>
</html>
